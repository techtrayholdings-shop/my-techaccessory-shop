<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shop | TechTray Holdings</title>

<link rel="stylesheet" href="CSS/style.css">
<link rel="stylesheet" href="CSS/shop.css">
<link rel="stylesheet" href="CSS/responsive.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<div id="header"></div>

<!-- SHOP HERO -->

<section class="shop-hero">

    <div class="container">

        <h1>TechTray Shop</h1>

        <p>

            Browse our premium collection of electronics,
            accessories and smart technology.

        </p>

    </div>

</section>

<!-- SHOP CONTENT -->

<section class="shop-layout">

<div class="container shop-container">

<!-- LEFT SIDEBAR -->

<aside class="shop-sidebar">

    <div class="shop-category-header">

    <h3>Shop Categories</h3>

    <p>Select a category to browse our products.</p>

</div>

<div class="category-scroll">

    <button class="filter-btn active" data-category="All">
        ⭐ All Products
    </button>

    <button class="filter-btn" data-category="Audio">
        🎧 Headphones & Earphones
    </button>

    <button class="filter-btn" data-category="Chargers">
        ⚡ Chargers
    </button>

    <button class="filter-btn" data-category="Cables">
        🔌 Charging Cables
    </button>

    <button class="filter-btn" data-category="Power Banks">
        🔋 Power Banks
    </button>

    <button class="filter-btn" data-category="Car Accessories">
        🚗 Vehicle Accessories
    </button>

    <button class="filter-btn" data-category="Gaming">
        🎮 Gaming Accessories
    </button>

    <button class="filter-btn" data-category="Smart Watches">
        ⌚ Smart Watches
    </button>

    <button class="filter-btn" data-category="Computer Accessories">
        💻 Computer Accessories
    </button>

    <button class="filter-btn" data-category="Smart Home">
        🏠 Smart Home
    </button>

    <button class="filter-btn" data-category="Phone Accessories">
        📱 Phone Accessories
    </button>

</div>

<!-- PRODUCTS -->

<div class="shop-products">

<div class="shop-toolbar">

<input
id="search"
type="text"
placeholder="Search products...">

<select id="sort-products">

<option value="default">Sort Products</option>

<option value="low-high">Price: Low to High</option>

<option value="high-low">Price: High to Low</option>

<option value="az">A - Z</option>

<option value="za">Z - A</option>

</select>

</div>

<div id="product-list" class="products-grid"></div>

</div>

</div>

</section>

<!-- ==========================================
     QUICK VIEW MODAL
========================================== -->

<div id="quick-view-modal" class="quick-view-modal">

    <div class="quick-view-content">

        <span class="close-modal">&times;</span>

        <div class="quick-view-grid">

            <div class="quick-view-image">

                <img
                    id="quick-image"
                    src=""
                    alt="Product">

            </div>

            <div class="quick-view-details">

                <h2 id="quick-name"></h2>

                <p id="quick-description"></p>

                <div class="quick-price">

                    <strong id="quick-price"></strong>

                </div>

                <button
                    id="quick-cart-btn"
                    class="cart-btn">

                    🛒 Add to Cart

                </button>

                <a
                    id="quick-product-link"
                    href="#"
                    class="view-btn">

                    View Full Product

                </a>

            </div>

        </div>

    </div>

</div>

<div id="footer"></div>

<script src="JS/navigation.js"></script>
<script src="JS/include.js"></script>
<script src="JS/products.js"></script>
<script src="JS/app.js"></script>

</body>

</html>
