<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shopping Cart | TechTray Holdings</title>

<link rel="stylesheet" href="CSS/style.css">
<link rel="stylesheet" href="CSS/responsive.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<!-- Header -->

<header class="header">

    <div class="container header-container">

        <!-- Logo -->
        <a href="index.html" class="logo">
            <img src="images/products/logo.jpg" alt="TechTray Holdings Logo">
            <div class="logo-text">
                <h2>TechTray</h2>
                <span>Holdings</span>
            </div>
        </a>

        <!-- Search -->
        <div class="search-box">
            <input
                type="text"
                id="search"
                placeholder="Search products...">
        </div>

        <!-- Header Icons -->
        <div class="header-icons">

            <a href="wishlist.html" class="wishlist-button" title="Wishlist">
                ❤
            </a>

            <a href="cart.html" class="cart-button" title="Shopping Cart">
                🛒
                <span id="cart-count">0</span>
            </a>

            <button
                id="menu-toggle"
                class="menu-toggle"
                aria-label="Open Navigation">
                ☰
            </button>

        </div>

    </div>

    <nav class="navigation" id="navigation">

        <a href="index.html">Home</a>

        <a href="shop.html">Shop</a>

        <a href="categories.html">Categories</a>

        <a href="about.html">About</a>

        <a href="contact.html">Contact</a>

        <a href="track-order.html">Track Order</a>

        <a href="cart.html">Cart</a>

    </nav>

</header>

<section class="featured-products">

<div class="container">

<div class="section-title">

<span>YOUR CART</span>

<h2>Shopping Cart</h2>

<p>Review your order before checkout.</p>

</div>

<div id="cart-items">

</div>

<h2 id="cart-total">

Total: R0

</h2>

<div class="hero-buttons">

<button class="btn btn-primary" onclick="checkoutWhatsApp()">

Checkout on WhatsApp

</button>

<button class="btn btn-secondary" onclick="clearCart()">

Clear Cart

</button>

</div>

</div>

</section>

<script src="JS/products.js"></script>
<script src="JS/cart.js"></script>

</body>

</html>
